# geraldine.hemisthia.com: Geraldine's Sparkle update feed and archives.
#
# Installed as /etc/nginx/sites-available/geraldine-updates.conf by
# deploy/updates/setup-update-host.sh. Publishing (scripts/release/
# publish-update.sh) only changes files below
# /var/www/geraldine.hemisthia.com/updates, never this configuration.
#
# Only two kinds of path exist: the feed, which changes with every release and
# must never be cached, and archives, whose names carry version and build and
# are never replaced. Everything else, including the publisher's .incoming
# staging folder, is 404.

server {
    server_name geraldine.hemisthia.com;
    root /var/www/geraldine.hemisthia.com;

    location = /updates/appcast.xml {
        types { }
        default_type application/xml;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location ~ "^/updates/Geraldine-[0-9][0-9A-Za-z.]*-[0-9]+\.zip$" {
        types { }
        default_type application/zip;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/geraldine.hemisthia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geraldine.hemisthia.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name geraldine.hemisthia.com;

    # Certificate renewals answer here (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
